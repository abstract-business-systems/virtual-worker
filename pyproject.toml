[project]
name = "virtual-worker"
version = "0.1.0"
description = "Virtual Worker ('Friday') — agent + backend, managed with uv"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper==1.0.3",
    "playwright==1.45.0",
    "mss==9.0.1",
    "pillow==10.3.0",
    "numpy",
    "rapidocr-onnxruntime==1.3.25",
    "requests",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# repo uses a PYTHONPATH layout (common/, backend/, agent/); keep tests
# runnable without setting PYTHONPATH manually
pythonpath = ["common", "backend", "agent"]