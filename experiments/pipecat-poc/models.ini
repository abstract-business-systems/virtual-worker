# Named modes — run with: ./run.sh <mode>   (default: realtime)
# Each mode is a pipeline TYPE (M8 naming):
#   realtime — realtime input transcript -> shared reasoning -> realtime speech
#   audio    — audio frontend -> shared reasoning -> audio speech (HTTP)
#   separate — dedicated transcriber -> same shared reasoning -> dedicated TTS
# Model fields:
#   voice = model that talks (audio in/out)   [audio/separate]
#   [reasoning] model = shared text model that answers and owns bash in all modes
#   stt   = transcriber for separate: whisper:<size> (local) or a
#           provider/model id (audio-in transcription via OpenRouter)

# Single source for task reasoning in ALL modes. CHAT_THINK_MODEL overrides
# this setting globally; --model continues to select only the voice frontend.
[reasoning]
model = openai/gpt-4o-mini

[realtime]
model = gpt-realtime-2.1-mini

[audio]
# Quality baseline first (M10). Mini remains available with --model; do not
# claim it has parity merely because glossary-specific fixtures passed.
voice = openai/gpt-audio
# glossary: domain terms the audio model tends to mishear; sent as a text
# hint next to input_audio (recognition biasing, ~zero cost). Env
# CHAT_GLOSSARY="" disables for A/B tests.
glossary = pipecat, Paseo, Viswanath, Virtual Worker, xrdp, PipeWire, OpenRouter, OpenAI, benchmark dataset, meeting notes, action items, calendar

[separate]
# voice = openai-tts:<name> -> dedicated speech endpoint:
#   openai-tts:coral            OpenAI gpt-4o-mini-tts (api.openai.com)
#   openai-tts:elevenlabs/eleven-v4-turbo
#                               ElevenLabs v4 turbo via OpenRouter /audio/speech
#                               (voice name from CHAT_TTS_VOICE, e.g. jessica)
# voice = openai/gpt-audio-mini -> previous chat-path voice (weak quality)
# voice = openai/gpt-audio -> ALL-OpenRouter speech via audio chat model
voice = openai-tts:elevenlabs/eleven-v4-turbo
# stt = openai:<model> transcribes via /audio/transcriptions at CHAT_STT_API_BASE
# (OpenRouter-hosted ElevenLabs Scribe keeps the same OpenRouter billing)
stt = openai:elevenlabs/scribe-v2