# Named modes — run with: ./run.sh <mode>   (default: realtime)
# Each mode is a pipeline TYPE (M8 naming):
#   realtime — one OpenAI realtime model listens, thinks, speaks (live session)
#   audio    — one audio-model call per turn, OpenRouter chat completions (HTTP)
#   separate — separate models: transcriber -> think model -> voice model
# Model fields:
#   voice = model that talks (audio in/out)   [audio/separate]
#   think = text model that answers (empty = voice model does everything) [audio]
#   stt   = transcriber for separate: whisper:<size> (local) or a
#           provider/model id (audio-in transcription via OpenRouter)

[realtime]
model = gpt-realtime-2.1-mini

[audio]
voice = openai/gpt-audio-mini
think =

[separate]
voice = openai/gpt-audio-mini
think = openai/gpt-4o-mini
stt = openai