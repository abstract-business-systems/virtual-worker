# Named presets — run with: ./run.sh <preset>   (default: mini)
# voice = model that talks (audio in/out). think = text model that answers.
# Empty think = the voice model does everything in one call.
# Add your own sections freely; ./run.sh picks them by name.

[mini]
voice = openai/gpt-audio-mini
think =

[mode1]
voice = openai/gpt-audio-mini
think = openai/gpt-4o-mini

[mode2]
voice = openai/gpt-audio-mini
think = openai/gpt-4o
