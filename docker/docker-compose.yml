services:
  abs-workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: abs-workspace:latest
    container_name: abs-workspace
    hostname: abs-workspace
    restart: unless-stopped
    ports:
      - "127.0.0.1:2222:22"          # ssh abs-worker@localhost (via ~/.ssh/config)
    volumes:
      - ..:/opt/virtual-worker       # live code, no rebuild for edits
      - vw-data:/var/lib/virtual-worker
    environment:
      - DISPLAY=:99
      - VW_SOCKET=/run/virtual-worker/agent.sock
      - VW_DB=/var/lib/virtual-worker/kb.db
      - VW_NAME=${VW_NAME:-Alex}
      - VW_OPERATOR_NAME=${VW_OPERATOR_NAME:-Operator}
      - VW_TEAM=${VW_TEAM:-Product}
      - VW_STT_MODEL=${VW_STT_MODEL:-base.en}
      - VW_BRAIN_BACKEND=${VW_BRAIN_BACKEND:-openrouter}
      - VW_BRAIN_MODEL=${VW_BRAIN_MODEL:-openai/gpt-4o-mini}
      - VW_TZ=${VW_TZ:-UTC}
      - GOOGLE_EMAIL=${GOOGLE_EMAIL:-}
      - GOOGLE_PASSWORD=${GOOGLE_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
volumes:
  vw-data: